<title>Expedientes Académicos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<style>
/* Layout: barra institucional + faixa do fluxo (5 etapas) + separadores por papel; detalhe do expediente abre numa folha lateral tipo "dossier". */
:root{
  --bg:#f3f5f4; --surface:#ffffff; --sunk:#e8ecea; --line:#d3dad7;
  --fg:#16232a; --muted:#5b6b70; --accent:#0f5f6a; --accent-ink:#ffffff; --accent-soft:#dcecec;
  --stamp:#a5322b; --ok:#23794a; --ok-soft:#dff1e5; --warn:#9a6400; --warn-soft:#f8ecd3; --bad:#a5322b; --bad-soft:#f6e0dd; --info-soft:#e2e8f5; --info:#2e4f8f;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif; --f-body:"IBM Plex Sans","Segoe UI",Roboto,Arial,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:8px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1719; --surface:#162226; --sunk:#1c2b30; --line:#2a3b40;
  --fg:#e3ecee; --muted:#93a6ab; --accent:#5cbcc7; --accent-ink:#06262b; --accent-soft:#163a40;
  --stamp:#ec7a70; --ok:#6cce93; --ok-soft:#173a27; --warn:#e8b45a; --warn-soft:#3a2e15; --bad:#ec7a70; --bad-soft:#41201d; --info-soft:#1f2b45; --info:#9db6ea; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1719; --surface:#162226; --sunk:#1c2b30; --line:#2a3b40;
  --fg:#e3ecee; --muted:#93a6ab; --accent:#5cbcc7; --accent-ink:#06262b; --accent-soft:#163a40;
  --stamp:#ec7a70; --ok:#6cce93; --ok-soft:#173a27; --warn:#e8b45a; --warn-soft:#3a2e15; --bad:#ec7a70; --bad-soft:#41201d; --info-soft:#1f2b45; --info:#9db6ea; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14.5px;line-height:1.5}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding-block:14px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.seal{width:40px;height:40px;border-radius:50%;border:2px solid var(--accent);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;color:var(--accent);font-size:13px;flex:none}
.brand h1{font-family:var(--f-display);font-size:19px;margin:0;font-weight:800;letter-spacing:-.01em;text-wrap:balance}
.brand p{margin:0;color:var(--muted);font-size:12.5px}
.who{font-size:12.5px;color:var(--muted);text-align:right}
.who b{color:var(--fg);font-weight:600}
.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;margin-block:18px 6px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.flow button{all:unset;cursor:pointer;padding:12px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;position:relative}
.flow button:last-child{border-right:0}
.flow button:hover{background:var(--sunk)}
.flow button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.flow .n{font-family:var(--f-mono);font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.flow .c{font-family:var(--f-display);font-size:26px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.flow .l{font-size:12.5px;color:var(--muted)}
.flow button.on{background:var(--accent-soft)}
.flow button.on .c{color:var(--accent)}
nav.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-block:14px;border-bottom:1px solid var(--line)}
nav.tabs button{all:unset;cursor:pointer;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:8px}
nav.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--accent)}
nav.tabs button:focus-visible{outline:2px solid var(--accent)}
.badge{font-family:var(--f-mono);font-size:11px;background:var(--stamp);color:#fff;border-radius:10px;padding:0 7px;line-height:18px}
main{padding-bottom:48px}
.grid2{display:grid;grid-template-columns:minmax(0,380px) minmax(0,1fr);gap:20px;align-items:start}
@media (max-width:860px){.grid2{grid-template-columns:minmax(0,1fr)}.flow{grid-template-columns:repeat(5,minmax(0,1fr))}.flow .l{display:none}.flow button{padding:10px 8px}.flow .c{font-size:21px}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.panel h2,.sec h2{font-family:var(--f-display);font-size:16px;margin:0 0 4px;font-weight:700}
.hint{color:var(--muted);font-size:13px;margin:0 0 14px}
form .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:480px){form .row{grid-template-columns:1fr}}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:10px;min-width:0}
input,select,textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%;min-width:0;font-weight:400;font-size:14px}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.drop{border:1.5px dashed var(--line);border-radius:var(--r);padding:14px;text-align:center;color:var(--muted);font-size:13px;cursor:pointer;background:var(--bg)}
.drop.has{border-style:solid;border-color:var(--accent);color:var(--fg)}
.drop:focus-within{outline:2px solid var(--accent)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg label{flex:1;text-align:center;padding:8px 6px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted);border-right:1px solid var(--line)}
.seg label:last-child{border-right:0}
.seg input{position:absolute;opacity:0;width:0;height:0}
.seg label:has(input:checked){background:var(--accent);color:var(--accent-ink)}
.seg label:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:-3px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--accent);color:var(--accent-ink);font-weight:600;padding:9px 16px;border-radius:6px;font-size:14px;text-align:center}
.btn:hover{filter:brightness(1.08)}
.btn:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}
.btn.stamp{background:var(--stamp);color:#fff}
.btn.sm{padding:5px 10px;font-size:12.5px}
.btn[disabled]{opacity:.45;pointer-events:none}
.btn.full{width:100%}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.toolbar input,.toolbar select{width:auto;flex:1;min-width:140px}
.list{display:flex;flex-direction:column;gap:8px}
.item{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.item:hover{border-color:var(--accent)}
.item:focus-visible{outline:2px solid var(--accent)}
.item .ref{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.item .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item .m{font-size:12.5px;color:var(--muted);grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;border-radius:20px;padding:2px 9px;white-space:nowrap;align-self:start}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-recebido{background:var(--info-soft);color:var(--info)}
.p-em_pareceres{background:var(--warn-soft);color:var(--warn)}
.p-pronto_decisao{background:var(--accent-soft);color:var(--accent)}
.p-decidido{background:var(--ok-soft);color:var(--ok)}
.p-pendente{background:var(--warn-soft);color:var(--warn)}
.p-emitido{background:var(--ok-soft);color:var(--ok)}
.mini{display:flex;gap:3px;align-items:center}
.mini i{width:18px;height:5px;border-radius:3px;background:var(--line)}
.mini i.d{background:var(--ok)}
.empty{border:1.5px dashed var(--line);border-radius:var(--r);padding:28px 18px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--f-display);font-size:15px;margin-bottom:4px}
.banner{border-radius:var(--r);padding:10px 14px;font-size:13px;margin-top:14px;background:var(--warn-soft);color:var(--fg);border:1px solid var(--line)}
/* Folha de detalhe */
.sheet-bg{position:fixed;inset:0;background:rgba(10,20,22,.45);z-index:20;display:flex;justify-content:flex-end}
.sheet{background:var(--bg);width:min(760px,100%);height:100%;overflow-y:auto;box-shadow:-8px 0 30px rgba(0,0,0,.2);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet-h{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:12px;align-items:flex-start;z-index:2}
.sheet-h .ttl{flex:1;min-width:0}
.sheet-h h3{margin:0;font-family:var(--f-display);font-size:18px;text-wrap:balance;overflow-wrap:anywhere}
.sheet-b{padding:18px;display:flex;flex-direction:column;gap:16px}
.x{all:unset;cursor:pointer;width:34px;height:34px;display:grid;place-items:center;border-radius:6px;font-size:20px;color:var(--muted);flex:none}
.x:hover{background:var(--sunk)}
.x:focus-visible{outline:2px solid var(--accent)}
.steps{display:flex;gap:0;flex-wrap:wrap}
.steps span{font-size:12px;padding:4px 10px 4px 14px;background:var(--sunk);color:var(--muted);clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%,8px 50%);margin-right:-4px;font-weight:600}
.steps span:first-child{clip-path:polygon(0 0,calc(100% - 8px) 0,100% 50%,calc(100% - 8px) 100%,0 100%);padding-left:10px}
.steps span.d{background:var(--accent);color:var(--accent-ink)}
.steps span.cur{background:var(--warn-soft);color:var(--warn)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px}
dl.kv{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:6px 16px;margin:8px 0 0;font-size:13.5px}
dl.kv dt{color:var(--muted)}
dl.kv dd{margin:0;overflow-wrap:anywhere}
.scan{display:block;border:1px solid var(--line);border-radius:6px;max-height:420px;width:auto;margin:10px auto 0;background:#fff}
.pr{border-top:1px solid var(--line);padding-top:12px;margin-top:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
.pr:first-of-type{border-top:0;margin-top:6px;padding-top:4px}
.pr .nm{font-weight:600}
.pr .cg{font-size:12.5px;color:var(--muted)}
.pr .tx{grid-column:1/-1;white-space:pre-wrap;font-size:13.5px;background:var(--bg);border-radius:6px;padding:10px 12px;overflow-wrap:anywhere}
.pr .sg{grid-column:1/-1;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pr .sg img{height:46px;background:#fff;border-radius:4px;border:1px solid var(--line)}
.hash{font-family:var(--f-mono);font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.addrow{display:grid;grid-template-columns:1.2fr 1fr 1.3fr auto;gap:8px;align-items:end;margin-bottom:8px}
@media (max-width:620px){.addrow{grid-template-columns:1fr}}
.chips{display:flex;flex-direction:column;gap:6px;margin:6px 0 12px}
.chip{display:flex;gap:10px;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:13px;min-width:0}
.chip span{flex:1;min-width:0;overflow-wrap:anywhere}
.sigbox{border:1px solid var(--line);border-radius:6px;background:#fff;position:relative;touch-action:none}
.sigbox canvas{display:block;width:100%;height:150px;cursor:crosshair}
.sigbox .lbl{position:absolute;left:12px;bottom:28px;right:12px;border-top:1px dashed #9aa7aa;pointer-events:none}
.sigbox .lbl::after{content:"Assine aqui com o rato ou o dedo";position:absolute;left:0;top:4px;font-size:11px;color:#7b8a8d}
.decision{border:2px solid var(--stamp);border-radius:var(--r);padding:16px;position:relative}
.decision .stampmark{font-family:var(--f-display);font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--stamp);border:2px solid var(--stamp);display:inline-block;padding:3px 10px;transform:rotate(-3deg);border-radius:4px;font-size:15px}
.timeline{list-style:none;margin:8px 0 0;padding:0;font-size:13px}
.timeline li{display:grid;grid-template-columns:120px minmax(0,1fr);gap:10px;padding:5px 0;border-bottom:1px dotted var(--line)}
.timeline li time{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}
@media (max-width:480px){.timeline li{grid-template-columns:1fr;gap:0}}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:6px;z-index:40;font-size:13.5px;max-width:calc(100% - 32px)}
.modal-bg{position:fixed;inset:0;background:rgba(10,20,22,.5);z-index:30;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:var(--r);max-width:600px;width:100%;max-height:90%;overflow-y:auto;padding:20px;border:1px solid var(--line)}
.modal h3{margin:0 0 8px;font-family:var(--f-display)}
.msg{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:10px;white-space:pre-wrap;font-size:12.5px;font-family:var(--f-mono);max-height:180px;overflow:auto;user-select:all}
.note{font-size:12px;color:var(--muted)}
.mono{font-family:var(--f-mono)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:sl .18s ease-out}@keyframes sl{from{transform:translateX(24px);opacity:.6}}}
</style>

<header class="top"><div class="wrap">
  <div class="brand"><div class="seal" aria-hidden="true">EXP</div>
    <div style="min-width:0"><h1>Expedientes Académicos</h1><p id="inst">Gestão de cartas e requerimentos de estudantes</p></div></div>
  <div class="who" id="who">A ligar à base de dados…</div>
</div></header>

<div class="wrap">
  <div class="flow" id="flow" role="group" aria-label="Fluxo do expediente"></div>
  <div id="banner"></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="view"></main>
</div>
<div id="layer"></div>

<script>
/* ---------- Configuração do domínio ---------- */
const APP_URL = "https://claude.ai/artifact/5Jy2MYt89Gqum8VpKTfic8";
const CURSOS = ["Administração e Gestão Hospitalar","Análises Clínicas e Laboratoriais","Farmácia","Psicologia Clínica e Assistência Social","Enfermagem","Medicina Geral","Mestrado em Gestão de Serviços de Saúde","Mestrado em Psicologia em Saúde","Mestrado em Saúde Pública"];
const TIPOS = ["Revisão de nota / prova","Exame de época especial","Equivalência de disciplinas","Transferência de curso","Mudança de turno ou regime","Anulação ou suspensão de matrícula","Reingresso","Prorrogação do pagamento de propinas","Justificação de faltas","Emissão de certificado ou declaração","Prorrogação de prazo de monografia"];
function tiposAll(){const extra=(S.tiposExtra||[]).filter(t=>!TIPOS.some(x=>x.toLowerCase()===t.toLowerCase()));return[...TIPOS,...extra.sort((a,b)=>a.localeCompare(b,"pt")),"Outro"]}
const ASSIST = {direcao:"Assistente da Direcção", pedagogica:"Assistente Pedagógica"};
const DECISORES = {director:"Director", director_pedagogico:"Director Pedagógico", administradora:"Administradora"};
const ESTADOS = {recebido:"Recebido", em_pareceres:"Em pareceres", pronto_decisao:"Aguarda decisão", decidido:"Decidido"};
const SENTIDOS = {favoravel:"Favorável", desfavoravel:"Desfavorável", condicionado:"Favorável com condições"};
const DECISOES = {deferido:"Deferido", indeferido:"Indeferido", deferido_parcial:"Deferido parcialmente"};
const TABS = [["secretaria","Secretaria"],["assistentes","Assistentes"],["pareceres","Pareceres"],["decisao","Decisão final"],["arquivo","Arquivo"]];

/* ---------- Estado ---------- */
const S = {db:null,user:null,mcp:null,assets:null,downloads:null,me:null,canEdit:false,
  exps:[],pars:[],cfg:{},loaded:false,dbFail:false,
  tab:ls("tab","secretaria"), assist:ls("assist","direcao"), decisor:ls("decisor","director"),
  myEmail:ls("myEmail",""), q:"", stage:"", open:null, scanFile:null};
function ls(k,d){try{return localStorage.getItem("exp."+k)??d}catch(e){return d}}
function lss(k,v){try{localStorage.setItem("exp."+k,v)}catch(e){}}
const $=s=>document.querySelector(s);
const h=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const now=()=>new Date().toISOString();
const fmt=(iso,t=true)=>{if(!iso)return"—";const d=new Date(iso);return d.toLocaleDateString("pt-MZ",{day:"2-digit",month:"2-digit",year:"numeric"})+(t?" "+d.toLocaleTimeString("pt-MZ",{hour:"2-digit",minute:"2-digit"}):"")};
const rid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const okEmail=e=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e||"");
async function sha(t){try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){return"indisponível"}}
const shortHash=x=>(x||"").slice(0,24).replace(/(.{4})/g,"$1 ").trim();
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;d.setAttribute("role","status");document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}

/* ---------- Derivados ---------- */
const parsOf=id=>S.pars.filter(p=>p.expId===id).sort((a,b)=>(a.ordem||0)-(b.ordem||0));
function stageOf(e){const ps=parsOf(e.id);
  if(e.estado==="decidido")return 4; if(e.estado==="pronto_decisao")return 3;
  if(e.estado==="em_pareceres")return ps.length&&ps.every(p=>p.estado==="emitido")?2.5:2; return 1}
function pend(){const mine=(S.myEmail||"").toLowerCase();
  return {secretaria:0,
    assistentes:S.exps.filter(e=>e.assistente===S.assist&&(e.estado==="recebido"||stageOf(e)===2.5)).length,
    pareceres:S.pars.filter(p=>p.estado==="pendente"&&mine&&p.email.toLowerCase()===mine&&(S.exps.find(e=>e.id===p.expId)||{}).estado==="em_pareceres").length,
    decisao:S.exps.filter(e=>e.estado==="pronto_decisao"&&e.decisor===S.decisor).length, arquivo:0}}

/* ---------- Render principal ---------- */
function render(){
  const c=S.cfg; $("#inst").textContent=[c.instituicao,c.unidade].filter(Boolean).join(" · ")||"Gestão de cartas e requerimentos de estudantes";
  const st=[["01","Recebidos",S.exps.filter(e=>e.estado==="recebido").length,"recebido"],
    ["02","Em pareceres",S.exps.filter(e=>e.estado==="em_pareceres").length,"em_pareceres"],
    ["03","Pareceres pendentes",S.pars.filter(p=>p.estado==="pendente").length,"pp"],
    ["04","Aguardam decisão",S.exps.filter(e=>e.estado==="pronto_decisao").length,"pronto_decisao"],
    ["05","Decididos",S.exps.filter(e=>e.estado==="decidido").length,"decidido"]];
  $("#flow").innerHTML=st.map(([n,l,c,k])=>`<button data-act="stage" data-k="${k}" class="${S.stage===k?"on":""}" aria-pressed="${S.stage===k}"><span class="n">${n}</span><span class="c">${c}</span><span class="l">${l}</span></button>`).join("");
  const p=pend();
  $("#tabs").innerHTML=TABS.map(([k,l])=>`<button role="tab" aria-selected="${S.tab===k}" data-act="tab" data-k="${k}">${l}${p[k]?`<span class="badge" aria-label="${p[k]} pendentes">${p[k]}</span>`:""}</button>`).join("");
  let b="";
  if(S.dbFail)b=`<div class="banner"><b>Sem ligação à base de dados.</b> Abra esta página no claude.ai com a sessão iniciada para registar e consultar expedientes.</div>`;
  else if(!S.loaded)b=`<div class="banner">A carregar expedientes…</div>`;

function bindDrop(){const d=$("#drop"),f=$("#r_file");if(!d)return;
  d.onclick=()=>f.click();
  d.ondragover=e=>{e.preventDefault();d.classList.add("has")};
  d.ondragleave=()=>{if(!S.scanFile)d.classList.remove("has")};
  d.ondrop=e=>{e.preventDefault();if(e.dataTransfer.files[0])setFile(e.dataTransfer.files[0])};
  f.onchange=()=>f.files[0]&&setFile(f.files[0]);
  if(S.scanFile)setFile(S.scanFile)}
function setFile(file){S.scanFile=file;const d=$("#drop");d.classList.add("has");$("#dropT").innerHTML=`<b>${h(file.name)}</b> · ${(file.size/1024).toFixed(0)} KB — <u>trocar</u>`}

async function storeScan(file,expId){
  if(S.assets){try{const r=await S.assets.upload(file);return{assetId:r.id,url:r.url,nome:file.name,tipo:r.contentType||file.type}}catch(e){console.warn("upload",e)}}
  // alternativa: guardar uma versão compactada na base de dados
  let dataUrl;
  if(file.type.startsWith("image/"))dataUrl=await shrinkImage(file,1400,.72);
  else{if(file.size>700*1024)throw new Error("O PDF tem mais de 700 KB e não foi possível usar o armazenamento de ficheiros. Digitalize em menor resolução ou como imagem.");dataUrl=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(file)})}
  await S.db.doc("digitalizacoes/"+expId).set({dataUrl,nome:file.name,tipo:file.type});
  return{inline:true,nome:file.name,tipo:file.type.startsWith("image/")?"image/jpeg":file.type}}
function shrinkImage(file,max,q){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=img.width*s;c.height=img.height*s;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);res(c.toDataURL("image/jpeg",q))};img.onerror=rej;img.src=URL.createObjectURL(file)})}

async function registar(ev){ev.preventDefault();if(!S.db)return toast("Sem ligação à base de dados.");
  if(!S.scanFile)return toast("Anexe a carta digitalizada antes de submeter.");
  let tipoSel=$("#r_tipo").value;
  if(tipoSel==="Outro"){tipoSel=$("#r_tipo_outro").value.trim().replace(/\s+/g," ");if(tipoSel.length<3)return toast("Indique o tipo de pedido no campo «Indique o tipo de pedido».");tipoSel=tipoSel.charAt(0).toUpperCase()+tipoSel.slice(1)}
  const btn=$("#r_btn");btn.disabled=true;btn.textContent="A registar…";
  try{const id=rid();const yr=new Date().getFullYear();
    const n=S.exps.filter(e=>(e.ref||"").includes("/"+yr+"/")).length+1;
    const ref=`EXP/${yr}/${String(n).padStart(4,"0")}`;
    const scan=await storeScan(S.scanFile,id);
    const ass=document.querySelector('input[name="r_ass"]:checked').value;
    const e={ref,estudante:$("#r_nome").value.trim(),numeroEstudante:$("#r_num").value.trim(),curso:$("#r_curso").value,tipoPedido:tipoSel,
      assunto:$("#r_assunto").value.trim(),contacto:$("#r_contacto").value.trim(),folhas:Number($("#r_folhas").value||1),dataRecepcao:$("#r_data").value,
      scan,assistente:ass,estado:"recebido",criadoEm:now(),criadoPor:S.me?.name||"Secretaria",
      historico:[{em:now(),acao:`Carta registada na secretaria e submetida à ${ASSIST[ass]}`,por:S.me?.name||"Secretaria"}]};
    await S.db.doc("expedientes/"+id).set(e);
    if(!tiposAll().some(t=>t.toLowerCase()===tipoSel.toLowerCase())){try{await S.db.doc("config/tipos").set({lista:[...(S.tiposExtra||[]),tipoSel]})}catch(x){console.warn(x)}}
    S.scanFile=null;$("#fReg").reset();$("#r_outro_w").hidden=true;$("#dropT").textContent="Arraste o ficheiro para aqui ou escolha do computador";$("#drop").classList.remove("has");
    const em=S.cfg.emails?.[ass];
    if(okEmail(em)){const r=await notify(em,`Novo expediente ${ref}: ${e.tipoPedido}`,
      `Bom dia,\n\nDeu entrada na secretaria o expediente ${ref}.\n\nEstudante: ${e.estudante} (${e.curso})\nPedido: ${e.tipoPedido}\nAssunto: ${e.assunto}\n\nAceda à plataforma, separador «Assistentes», para encaminhar aos intervenientes.\n${APP_URL}\n\nCumprimentos,\nSecretaria`);
      toast(r==="enviado"?`${ref} registado. ${ASSIST[ass]} notificada por e-mail.`:`${ref} registado. Não foi possível enviar o e-mail automático.`)}
    else toast(`${ref} registado e submetido à ${ASSIST[ass]}.`);
  }catch(err){toast(err.message||"Não foi possível registar. Tente de novo.")}
  finally{btn.disabled=false;btn.textContent="Registar e submeter"}}

function renderSheet(){

async function loadInline(e){try{const d=await S.db.doc("digitalizacoes/"+e.id).get();const x=d.data();const el=$("#scanInline");if(!el||!x)return;
  el.outerHTML=x.tipo.startsWith("image/")?`<img class="scan" src="${x.dataUrl}" alt="Carta digitalizada">`:`<p><a class="btn ghost sm" href="${x.dataUrl}" target="_blank" rel="noopener">Abrir carta digitalizada (${h(x.nome)})</a></p>`}catch(err){}}
function timeline(e,ps){const t=[...(e.historico||[])];
  ps.forEach(p=>{if(p.emitidoEm)t.push({em:p.emitidoEm,acao:`Parecer ${SENTIDOS[p.sentido].toLowerCase()} emitido e assinado por ${p.nome}`})});

/* ---------- Assinatura ---------- */
const SIG={};
function sigPad(box){const c=box.querySelector("canvas"),x=c.getContext("2d"),k=box.dataset.key;SIG[k]={c,drawn:false};
  x.lineWidth=4;x.lineCap="round";x.lineJoin="round";x.strokeStyle="#0b2340";let dn=false;
  const pt=ev=>{const r=c.getBoundingClientRect();return[(ev.clientX-r.left)*c.width/r.width,(ev.clientY-r.top)*c.height/r.height]};
  c.onpointerdown=ev=>{dn=true;c.setPointerCapture(ev.pointerId);const[a,b]=pt(ev);x.beginPath();x.moveTo(a,b)};
  c.onpointermove=ev=>{if(!dn)return;const[a,b]=pt(ev);x.lineTo(a,b);x.stroke();SIG[k].drawn=true};
  c.onpointerup=c.onpointercancel=()=>{dn=false}}
function sigData(k){const s=SIG[k];if(!s||!s.drawn)return null;
  const {c}=s,x=c.getContext("2d"),d=x.getImageData(0,0,c.width,c.height).data;let a=c.width,b=c.height,m=0,n=0;
  for(let y=0;y<c.height;y+=2)for(let i=0;i<c.width;i+=2){if(d[(y*c.width+i)*4+3]>0){if(i<a)a=i;if(i>m)m=i;if(y<b)b=y;if(y>n)n=y}}
  const w=Math.max(10,m-a+12),hh=Math.max(10,n-b+12),o=document.createElement("canvas");o.width=w;o.height=hh;o.getContext("2d").drawImage(c,a-6,b-6,w,hh,0,0,w,hh);return o.toDataURL("image/png")}

  for(const [i,x] of list.entries()){const pid=e.id+"_"+(base+i+1);
    const body=`Caro(a) ${x.nome},\n\nSolicita-se o seu parecer sobre o expediente ${e.ref}.\n\nEstudante: ${e.estudante}${e.numeroEstudante?" (código "+e.numeroEstudante+")":""}\nCurso: ${e.curso}\nPedido: ${e.tipoPedido}\nAssunto: ${e.assunto}\n\nAceda à plataforma de Expedientes Académicos, separador «Pareceres», e entre com este e-mail (${x.email}) para ler a carta, emitir o parecer e assinar electronicamente.\n${APP_URL}\n\nCumprimentos,\n${por}\n${ASSIST[e.assistente]}`;

async function emitir(pid){const p=S.pars.find(x=>x.id===pid);if(!p)return;

/* ---------- Documento final (PDF) ---------- */
async function imgData(src){return new Promise(r=>{const i=new Image();i.crossOrigin="anonymous";i.onload=()=>{try{const c=document.createElement("canvas");c.width=i.width;c.height=i.height;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0);r({d:c.toDataURL("image/jpeg",.85),w:i.width,h:i.height})}catch(e){r(null)}};i.onerror=()=>r(null);i.src=src})}
function b64ToBytes(d){const b=atob(d.split(",")[1]);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u}
async function scanBytes(e){
  if(!e.scan)return null;
  if(e.scan.inline){const x=(await S.db.doc("digitalizacoes/"+e.id).get()).data();if(!x)return null;
    if((x.tipo||"").startsWith("image/"))return{kind:"img",src:x.dataUrl};return{kind:"pdf",bytes:b64ToBytes(x.dataUrl)}}
  if((e.scan.tipo||"").startsWith("image/"))return{kind:"img",src:e.scan.url};
  const r=await fetch(e.scan.url);if(!r.ok)throw new Error("scan");return{kind:"pdf",bytes:new Uint8Array(await r.arrayBuffer())}}

/* Verso: pareceres e despacho, gerado com jsPDF */
async function versoPDF(e){
  const {jsPDF}=window.jspdf;const doc=new jsPDF({unit:"mm",format:"a4"});const L=18,W=174;let y=16;
  const ink=[22,35,42],acc=[15,95,106],red=[165,50,43],mut=[91,107,112];
  const need=n=>{if(y+n>282){doc.addPage();y=16}};
  const txt=(t,size=9.5,style="normal",col=ink,x=L,w=W)=>{doc.setFont("helvetica",style);doc.setFontSize(size);doc.setTextColor(...col);doc.splitTextToSize(String(t||""),w).forEach(l=>{need(size*.42);doc.text(l,x,y);y+=size*.42})};
  txt(S.cfg.instituicao||"Instituição de Ensino Superior",10.5,"bold");
  txt(`PARECERES E DESPACHO  ·  Expediente ${e.ref}`,12,"bold",acc);y+=1;
  txt(`${e.estudante}${e.numeroEstudante?"  ·  Código "+e.numeroEstudante:""}  ·  ${e.curso}`,9,"normal",mut);
  txt(`Pedido: ${e.tipoPedido}  ·  Recebido em ${fmt(e.dataRecepcao,false)}  ·  Encaminhado por ${ASSIST[e.assistente]}`,9,"normal",mut);
  y+=2;doc.setDrawColor(...acc);doc.setLineWidth(.4);doc.line(L,y,L+W,y);y+=5;
  const ps=parsOf(e.id).filter(p=>p.estado==="emitido");
  for(const [i,p] of ps.entries()){need(30);
    txt(`Parecer ${i+1} — ${p.nome}${p.cargo?", "+p.cargo:""}`,10,"bold");
    txt(`${SENTIDOS[p.sentido]}  ·  ${fmt(p.emitidoEm)}`,8.5,"bold",p.sentido==="desfavoravel"?red:acc);y+=.5;
    txt(p.texto,9.5);y+=1;
    if(p.assinatura){const im=await imgData(p.assinatura);if(im){need(13);const hh=11,ww=Math.min(48,hh*im.w/im.h);doc.addImage(p.assinatura,"PNG",L,y,ww,hh);
      doc.setFont("helvetica","normal");doc.setFontSize(6.5);doc.setTextColor(...mut);doc.text(`Assinatura electrónica · SHA-256 ${p.hash.slice(0,32)}…`,L+ww+4,y+hh-1);y+=hh+1}}
    y+=2;doc.setDrawColor(...mut);doc.setLineWidth(.1);doc.line(L,y,L+W,y);y+=4}
  const pend=parsOf(e.id).filter(p=>p.estado!=="emitido");
  if(pend.length){txt(`Pareceres ainda por emitir: ${pend.map(p=>p.nome).join(", ")}`,8.5,"italic",mut);y+=3}
  need(42);txt("DESPACHO",10.5,"bold",red);y+=2;
  const d=e.decisao;
  if(d){doc.setDrawColor(...red);doc.setLineWidth(.7);doc.setFont("helvetica","bold");doc.setFontSize(13);doc.setTextColor(...red);
    const lab=DECISOES[d.sentido].toUpperCase();const tw=doc.getTextWidth(lab)+8;doc.rect(L,y-5,tw,8.5);doc.text(lab,L+4,y+1);y+=8;
    txt(d.texto,9.5);y+=2;
    if(d.assinatura){const im=await imgData(d.assinatura);if(im){need(18);const hh=15,ww=Math.min(60,hh*im.w/im.h);doc.addImage(d.assinatura,"PNG",L,y,ww,hh);y+=hh+1}}
    doc.setDrawColor(...mut);doc.setLineWidth(.2);doc.line(L,y,L+75,y);y+=4;txt(d.nome,9.5,"bold");txt(`${DECISORES[e.decisor]}  ·  ${fmt(d.em)}`,8.5,"normal",mut);
    txt(`Assinatura electrónica · SHA-256 ${d.hash}`,6.5,"normal",mut)}
  else{txt(`A aguardar decisão${e.decisor?" do "+DECISORES[e.decisor]:""}.`,9,"italic",mut);y+=4;doc.setDrawColor(...mut);doc.setLineWidth(.15);for(let k=0;k<4;k++){need(8);doc.line(L,y,L+W,y);y+=8}}
  const n=doc.getNumberOfPages();for(let i=1;i<=n;i++){doc.setPage(i);doc.setFontSize(7);doc.setTextColor(...mut);doc.setFont("helvetica","normal");doc.text(`${e.ref}  ·  Verso do requerimento  ·  ${i}/${n}`,L,291)}
  return doc.output("arraybuffer")}

async function gerarPDF(e){
  if(!window.jspdf)return toast("O gerador de PDF não carregou. Recarregue a página.");
  const verso=await versoPDF(e);let out=verso,aviso="";
  if(window.PDFLib){try{
    const {PDFDocument,StandardFonts,rgb}=window.PDFLib;const pdf=await PDFDocument.create();const A4=[595.28,841.89];
    const sc=await scanBytes(e);
    if(sc?.kind==="pdf"){const src=await PDFDocument.load(sc.bytes,{ignoreEncryption:true});(await pdf.copyPages(src,src.getPageIndices())).forEach(pg=>pdf.addPage(pg))}
    else if(sc?.kind==="img"){const im=await imgData(sc.src);if(!im)throw new Error("img");const jpg=await pdf.embedJpg(b64ToBytes(im.d));
      const pg=pdf.addPage(A4);const m=28,s=Math.min((A4[0]-2*m)/im.w,(A4[1]-2*m)/im.h);const w=im.w*s,hh=im.h*s;pg.drawImage(jpg,{x:(A4[0]-w)/2,y:(A4[1]-hh)/2,width:w,height:hh})}
    else aviso=" A carta digitalizada não foi encontrada: o PDF contém só os pareceres.";
    if(pdf.getPageCount()){const f=await pdf.embedFont(StandardFonts.HelveticaBold);const p1=pdf.getPage(0);const {width,height}=p1.getSize();
      const label=`${e.ref}  ·  Recebido ${fmt(e.dataRecepcao,false)}  ·  Pareceres e despacho no verso`;
      const tw=f.widthOfTextAtSize(label,7.5);p1.drawRectangle({x:width-tw-22,y:height-20,width:tw+12,height:13,color:rgb(1,1,1),borderColor:rgb(.06,.37,.42),borderWidth:.8});
      p1.drawText(label,{x:width-tw-16,y:height-15.5,size:7.5,font:f,color:rgb(.06,.37,.42)});
      if(pdf.getPageCount()%2===0)aviso=" A carta tem um número par de páginas: os pareceres começam numa folha nova.";}
    const vs=await PDFDocument.load(verso);(await pdf.copyPages(vs,vs.getPageIndices())).forEach(pg=>pdf.addPage(pg));
    out=await pdf.save();
  }catch(err){console.warn("pdf-lib",err);aviso=" Não foi possível juntar a carta original: o PDF contém só os pareceres."}}
  else aviso=" Não foi possível juntar a carta original: o PDF contém só os pareceres.";
  const blob=new Blob([out],{type:"application/pdf"});const fn=e.ref.replace(/\//g,"-")+(e.decisao?"-final":"-pareceres")+".pdf";
  if(S.downloads){try{await S.downloads.save({filename:fn,data:blob});toast("PDF descarregado."+aviso);return}catch(err){if(err?.code==="declined")return toast("Descarga cancelada.")}}
  toast("A descarga não está disponível nesta vista. Abra a página no claude.ai.")}

  $("#layer").insertAdjacentHTML("beforeend",`<div class="modal-bg" id="mm"><form class="modal" id="fCfg"><h3>Definições</h3><p class="hint">Estes dados aparecem no documento final e são usados para as notificações automáticas.</p>
   <label class="f">Instituição<input id="c_inst" value="${h(c.instituicao||"")}" placeholder="Ex.: Universidade … — Faculdade de Economia"></label>
   <label class="f">Unidade / Direcção<input id="c_uni" value="${h(c.unidade||"")}" placeholder="Ex.: Direcção Pedagógica — Maputo"></label>
   ${f("direcao","Assistente da Direcção")}${f("pedagogica","Assistente Pedagógica")}${f("director","Director")}${f("director_pedagogico","Director Pedagógico")}${f("administradora","Administradora")}
   <div class="actions"><button class="btn" type="submit">Guardar</button><button class="btn ghost" type="button" data-act="closeModal">Cancelar</button></div></form></div>`)}
async function saveCfg(ev){ev.preventDefault();const ks=["direcao","pedagogica","director","director_pedagogico","administradora"];
  const d={instituicao:$("#c_inst").value.trim(),unidade:$("#c_uni").value.trim(),emails:{},nomes:{}};ks.forEach(k=>{d.emails[k]=$("#ce_"+k).value.trim();d.nomes[k]=$("#cn_"+k).value.trim()});
  try{await S.db.doc("config/geral").set(d);$("#mm").remove();toast("Definições guardadas.")}catch(e){toast("Não foi possível guardar as definições.")}}

/* ---------- Eventos ---------- */
document.addEventListener("click",async ev=>{const t=ev.target.closest("[data-act]");if(!t)return;const a=t.dataset.act;
  if(a==="close"&&t.classList.contains("sheet-bg")&&ev.target!==t)return;
  const e=S.exps.find(x=>x.id===S.open);
  try{switch(a){
    case"tab":S.tab=t.dataset.k;lss("tab",S.tab);S.open=null;S.q="";render();break;
    case"stage":S.stage=S.stage===t.dataset.k?"":t.dataset.k;render();break;
    case"open":S.open=t.dataset.id;S.draftI=[];render();break;
    case"close":S.open=null;$("#layer").innerHTML="";break;
    case"cfg":cfgModal();break;
    case"closeModal":$("#mm")?.remove();break;
    case"copy":{const m=S.manual[t.dataset.i];try{await navigator.clipboard.writeText(`Para: ${m.to}\nAssunto: ${m.subject}\n\n${m.body}`);toast("Mensagem copiada.")}catch(x){const r=document.createRange();r.selectNodeContents($("#msg"+t.dataset.i));getSelection().removeAllRanges();getSelection().addRange(r);toast("Texto seleccionado. Copie com Ctrl+C.")}break}
    case"addI":{const n=$("#i_nome").value.trim(),c=$("#i_cargo").value.trim(),m=$("#i_email").value.trim();
      if(!n||!okEmail(m))return toast("Indique o nome e um e-mail válido do interveniente.");
      S.draftI=[...(S.draftI||[]),{nome:n,cargo:c,email:m}];renderSheet();["i_nome","i_cargo","i_email"].forEach(k=>$("#"+k).value="");$("#i_nome").focus();break}
    case"rmI":S.draftI.splice(+t.dataset.i,1);renderSheet();break;
    case"encaminhar":t.disabled=true;t.textContent="A notificar…";await encaminhar(e);break;
    case"submeter":t.disabled=true;await submeter(e);break;
    case"clearSig":{const box=t.closest(".sec,.decision").querySelector(".sigbox");const k=box.dataset.key;const c=SIG[k].c;c.getContext("2d").clearRect(0,0,c.width,c.height);SIG[k].drawn=false;break}
    case"emitir":t.disabled=true;await emitir(t.dataset.pid);t.disabled=false;break;
    case"decidir":t.disabled=true;await decidir(e);t.disabled=false;break;
    case"pdf":{const lb=t.textContent;t.disabled=true;t.textContent="A gerar PDF…";await gerarPDF(e);t.disabled=false;t.textContent=lb;break}
  }}catch(err){console.error(err);toast(err?.message||"Ocorreu um erro. Tente de novo.");t.disabled=false}});
document.addEventListener("change",ev=>{const t=ev.target;
  if(t.dataset.act==="assist"){S.assist=t.value;lss("assist",t.value);render()}
  if(t.dataset.act==="decisor"){S.decisor=t.value;lss("decisor",t.value);render()}
  if(t.id==="r_tipo"){$("#r_outro_w").hidden=t.value!=="Outro";if(t.value==="Outro")$("#r_tipo_outro").focus()}
  if(t.id==="d_quem"){$("#d_nome").value=S.cfg.nomes?.[t.value]||"";$("#d_email").value=S.cfg.emails?.[t.value]||""}});
document.addEventListener("input",ev=>{if(ev.target.id==="q"){S.q=ev.target.value;const pos=ev.target.selectionStart;render();const q=$("#q");if(q){q.focus();q.setSelectionRange(pos,pos)}}});
document.addEventListener("submit",ev=>{if(ev.target.id==="fReg")registar(ev);
  if(ev.target.id==="fCfg")saveCfg(ev);
  if(ev.target.id==="fMail"){ev.preventDefault();S.myEmail=$("#myEmail").value.trim().toLowerCase();lss("myEmail",S.myEmail);render()}});
document.addEventListener("keydown",ev=>{if(ev.key==="Escape"){if($("#mm"))$("#mm").remove();else if(S.open){S.open=null;$("#layer").innerHTML=""}}});

/* ---------- Arranque ---------- */
render();
(async()=>{const use=n=>window.claude?.use?window.claude.use(n).catch(()=>null):Promise.resolve(null);
  const [db,user,mcp,assets,downloads]=await Promise.all(["db","user","mcp","assets","downloads"].map(use));
  Object.assign(S,{db,user,mcp,assets,downloads});
  if(user){try{S.me=await user.me();S.canEdit=await user.canEdit();if(!S.myEmail&&S.me?.email){S.myEmail=S.me.email.toLowerCase()}}catch(e){}}
  $("#who").innerHTML=S.me?.name?`Sessão: <b>${h(S.me.name)}</b>${S.me.email?`<br>${h(S.me.email)}`:""}`:"Sessão não identificada";
  if(!db){S.dbFail=true;render();return}
  const timer=setTimeout(()=>{if(!S.loaded){S.dbFail=true;render()}},10000);
  const done=()=>{clearTimeout(timer);S.loaded=true;S.dbFail=false};
  db.collection("expedientes").onSnapshot(s=>{done();S.exps=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>{S.dbFail=true;render()});
  db.collection("pareceres").onSnapshot(s=>{S.pars=s.docs.map(d=>({id:d.id,...d.data()}));render()});
  db.doc("config/geral").onSnapshot(s=>{S.cfg=s.data()||{};render()});
  db.doc("config/tipos").onSnapshot(s=>{S.tiposExtra=s.data()?.lista||[];const sel=$("#r_tipo");if(sel){const v=sel.value;sel.innerHTML=`<option value="">Seleccione o tipo de pedido</option>`+tiposAll().map(c=>`<option>${h(c)}</option>`).join("");sel.value=v}});
})();
</script>
